name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Django 5.2 LTS
          - { python-version: "3.10", django-version: "5.2" }
          - { python-version: "3.11", django-version: "5.2" }
          - { python-version: "3.12", django-version: "5.2" }
          - { python-version: "3.13", django-version: "5.2" }
          # Django 6.0
          - { python-version: "3.12", django-version: "6.0" }
          - { python-version: "3.13", django-version: "6.0" }
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          uv sync --all-extras
          uv pip install "django~=${{ matrix.django-version }}.0"
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
        run: uv run pytest -v

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --all-extras
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .

  example-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Django check on example project
        env:
          DJANGO_SETTINGS_MODULE: example_project.settings
        run: |
          cd example
          uv run python manage.py check
          uv run python manage.py migrate --run-syncdb --no-input

  js-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install JS dev dependencies
        run: npm ci
      - name: Run QUnit suite via npm test
        run: npm test
